name: Demo images (Docker Desktop)

# build image Docker ทั้งสองตัวจาก Dockerfile จริง แล้วลองรัน deploy/demo/docker-compose.demo.yml ให้ API ตอบ
# /health, ล็อกอินได้, ตาชั่งจำลองเปิดอยู่ และเว็บตอบ 200 — เป็น job แรกที่ build image Docker จริง (#61/#63
# บันทึกไว้ว่า CI ไม่เคย build จน Dockerfile เว็บพังเงียบ) บน main ผ่านแล้วอัปโหลด image เป็นไฟล์ไว้ที่
# release "demo" ให้ deploy/demo/install-demo.ps1 โหลดไปลง Docker Desktop บน Windows ได้ในบรรทัดเดียว
# (ไม่ต้องมี git หรือ build เองในเครื่อง ดู docs/DECISIONS.md #65)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - 'app/Dockerfile'
      - 'app/.dockerignore'
      - 'app/nginx.conf'
      - 'app/pubspec.*'
      - 'backend/Dockerfile'
      - 'backend/package*.json'
      - 'deploy/demo/**'
      - '.github/workflows/demo-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: build image API
        run: docker build -t payneat-api:demo backend

      # เบราว์เซอร์ของผู้ใช้เป็นคนเรียก API จึงชี้ localhost:3000 ของเครื่องเขา (เหมือน docker-compose.yml)
      - name: build image เว็บ
        run: >
          docker build -t payneat-web:demo
          --build-arg API_BASE_URL=http://localhost:3000
          --build-arg DEMO_MODE=false
          app

      - name: smoke test ด้วย docker-compose.demo.yml
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/demo/docker-compose.demo.yml"
          $compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/health
          curl -sf -o /dev/null http://localhost:8080/
          token=$(curl -sf -H 'content-type: application/json' \
            -d '{"username":"cashier","password":"cashier123"}' \
            http://localhost:3000/api/v1/auth/login | jq -r '.data.token')
          driver=$(curl -sf -H "authorization: Bearer $token" http://localhost:3000/api/v1/scale | jq -r '.data.driver')
          echo "scale driver: $driver"
          test "$driver" = simulator
          $compose down -v

      - name: รวม image เป็นไฟล์
        if: github.ref == 'refs/heads/main'
        run: |
          docker save payneat-api:demo payneat-web:demo | gzip > payneat-demo-images.tar.gz
          ls -lh payneat-demo-images.tar.gz

      - name: อัปโหลดไปที่ release "demo"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f demo "$GITHUB_SHA"
          git push -f origin refs/tags/demo
          notes="PaynEat สำหรับเดโมบน Docker Desktop (Windows) — build จาก commit ${GITHUB_SHA::7}

          วางบรรทัดนี้ใน PowerShell แล้วกด Enter (ต้องเปิด Docker Desktop ไว้ก่อน):

          \`\`\`
          [Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object Net.WebClient).DownloadString('https://github.com/SuruchBoss/PaynEat/releases/download/demo/install-demo.ps1'))
          \`\`\`

          ระบบจะเปิด http://localhost:8080 ให้เอง — ล็อกอิน admin / admin123 (ดู README ทางเลือก D)"
          if gh release view demo > /dev/null 2>&1; then
            gh release edit demo --title "PaynEat demo (Docker Desktop)" --notes "$notes" --prerelease
          else
            gh release create demo --title "PaynEat demo (Docker Desktop)" --notes "$notes" --prerelease --verify-tag
          fi
          gh release upload demo --clobber \
            payneat-demo-images.tar.gz \
            deploy/demo/docker-compose.demo.yml \
            deploy/demo/install-demo.ps1
