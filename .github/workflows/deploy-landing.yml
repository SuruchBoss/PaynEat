name: Deploy landing page

# Landing page (docs/landing/index.html) เป็น static HTML ไฟล์เดียว ไม่มี build step
# deploy ขึ้น GitHub Pages ทุกครั้งที่มีการแก้ไฟล์นี้บน main (หรือกดรันเองผ่าน workflow_dispatch)
#
# ต้องเปิดใช้งานครั้งเดียวก่อน: Settings → Pages → Build and deployment → Source:
# "GitHub Actions" (ไม่ใช่ "Deploy from a branch") — GitHub API ไม่มี endpoint ให้เปิดผ่าน
# workflow ได้เอง ต้องกดที่หน้า Settings ครั้งแรกเท่านั้น หลังจากนั้น workflow นี้ deploy อัตโนมัติ
on:
  push:
    branches: [main]
    paths:
      - 'docs/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# กันสอง deploy ชนกัน แต่ไม่ยกเลิกอันที่กำลังรันอยู่ (ต่างจาก CI) เพราะ deploy ค้างครึ่งทาง
# ทำให้หน้าเว็บจริงพังได้ ปล่อยให้คิวต่อแทน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - name: อัปโหลด docs/landing เป็น Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/landing

      - id: deployment
        uses: actions/deploy-pages@v4
